services:
  inference:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1500m
    cpus: 1
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
