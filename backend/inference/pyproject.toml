[project]
name = "ijwi-inference"
version = "0.2.0"
description = "Isolated FastAPI FastDRS retinal screening service"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11,<13"]

[project.optional-dependencies]
model = ["fastdrs==0.1.15", "torch>=2.13.0", "torchvision>=0.28.0"]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
